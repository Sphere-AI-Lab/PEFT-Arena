# =============================================================================
# PEFTArena Example Config: SFT + LoRA on Llama-3.2-3B-Instruct (Medical)
# =============================================================================
# Usage:
#   python run.py train sft \
#       --model meta-llama/Llama-3.2-3B-Instruct \
#       --adapter lora \
#       --lora_rank 8 --lora_alpha 16 \
#       --data_train data/med-train.parquet \
#       --data_val data/med-test.parquet \
#       --lr 2e-4 --epochs 4 \
#       --output_dir checkpoints/sft-lora-llama-r8-med

model:
  name: meta-llama/Llama-3.2-3B-Instruct
  dtype: bf16

adapter:
  type: lora
  rank: 8
  alpha: 16
  dropout: 0.05

training:
  type: sft
  lr: 2e-4
  batch_size: 256
  max_length: 8192
  micro_batch_size_per_gpu: 2
  epochs: 4
  save_freq: 91
  test_freq: 50
  num_gpus: 8

data:
  domain: med
  train_file: data/med-train.parquet
  val_file: data/med-test.parquet

logging:
  project_name: peft-arena
  logger: [console, wandb]
