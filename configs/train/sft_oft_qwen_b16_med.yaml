# =============================================================================
# PEFTArena Example Config: SFT + OFT on Qwen2.5-7B (Medical domain)
# =============================================================================
# Usage:
#   python run.py train sft \
#       --model Qwen/Qwen2.5-7B \
#       --adapter oft \
#       --oft_block_size 16 \
#       --data_train data/med-train.parquet \
#       --data_val data/med-test.parquet \
#       --lr 2e-4 --epochs 4 \
#       --output_dir checkpoints/sft-oft-qwen-b16

model:
  name: Qwen/Qwen2.5-7B
  dtype: bf16

adapter:
  type: oft
  block_size: 16

training:
  type: sft
  lr: 2e-4
  batch_size: 256
  max_length: 8192
  micro_batch_size_per_gpu: 2
  epochs: 4
  save_freq: 91
  test_freq: 50
  num_gpus: 8

data:
  domain: med
  train_file: data/med-train.parquet
  val_file: data/med-test.parquet

logging:
  project_name: peft-arena
  logger: [console, wandb]
